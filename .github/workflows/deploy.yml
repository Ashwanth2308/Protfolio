name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          # Optional features. Set these under Settings → Secrets and variables → Actions → Variables.
          # Anything left unset stays off.
          VITE_SITE_URL: ${{ vars.SITE_URL }}
          VITE_ANALYTICS: ${{ vars.ANALYTICS }}
          VITE_ANALYTICS_ID: ${{ vars.ANALYTICS_ID }}
          VITE_ANALYTICS_SRC: ${{ vars.ANALYTICS_SRC }}
          VITE_FORM_ENDPOINT: ${{ vars.FORM_ENDPOINT }}
          VITE_FORM_ACCESS_KEY: ${{ vars.FORM_ACCESS_KEY }}
          VITE_CHAT_API_URL: ${{ vars.CHAT_API_URL }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
